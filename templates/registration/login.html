<head>
  {% load static %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <title>Login</title>
</head>
<body>
{% block content %}
  {% load crispy_forms_tags %}
  <h2 class="form-title">Login as:</h2>
  <form class="signup-form" method="post" action="{% url 'login' %}">
    {% csrf_token %}
      <div class="mb-3" >
        {{ form.username|as_crispy_field }}
      </div>
    </div>
    <div class="row">
      <div class="mb-3">
        {{ form.password|as_crispy_field }}
      </div>
    </div>
    <div class="login-buttons">
      <button class="login-button btn btn-outline-dark" type="submit">Login</button>
       <a href="{% url 'task_management_app:signup' %}" class="login-button btn btn-outline-dark" role="button">Or join us right now</a>
    </div>
  </form>
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
