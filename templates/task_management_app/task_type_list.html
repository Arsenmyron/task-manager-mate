{% extends "base.html" %}
{% block content %}
  <div class="custom-btn-container">
    <a class="lg-hover btn btn-dark" href="{% url 'task-management:task-type-create' %}">Add task type</a>
  </div>
  <div class="container">
        <h1>Task Types</h1>
        <table class="task-types-table">
            <tbody>
                {% for task_type in task_type_list %}
                    <tr>
                        <td>{{ task_type.name }}</td>
                        <td>
                            <form method="post" action="{% url 'task-management:task-type-delete' task_type.id %}">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-dark">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="2">No task types available</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
