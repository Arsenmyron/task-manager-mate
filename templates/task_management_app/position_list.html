{% extends "base.html" %}
{% block content %}
  <div class="custom-btn-container">
    <a class="lg-hover btn btn-dark" href="{% url 'task-management:position-create' %}">Create new position</a>
  </div>
  <div class="container">
        <h1>Positions</h1>
        <table class="positions-table">
            <tbody>
                {% for position in position_list %}
                    <tr>
                        <td>{{ position.name }}</td>
                        <td>
                            <form method="post" action="{% url 'task-management:position-delete' position.id %}">
                                {% csrf_token %}
                                <button type="submit" class="btn btn-dark">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="2">No positions available</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
